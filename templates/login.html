<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex;
      align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f3f4f6; color: #111827;
    }
    .card {
      width: 100%; max-width: 360px; margin: 16px; padding: 28px;
      background: #fff; border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, .08);
    }
    h1 { margin: 0 0 20px; font-size: 1.4rem; }
    label { display: block; margin: 14px 0 6px; font-size: .9rem; }
    input {
      width: 100%; padding: 12px; font-size: 1rem;
      border: 1px solid #d1d5db; border-radius: 8px;
    }
    button {
      width: 100%; margin-top: 20px; padding: 12px; font-size: 1rem;
      color: #fff; background: #2563eb; border: 0; border-radius: 8px;
      cursor: pointer;
    }
    .erro { margin-top: 14px; color: #b91c1c; font-size: .9rem; }
  </style>
</head>
<body>
  <form class="card" method="post" action="{{ url_for('login') }}">
    <h1>Entrar</h1>

    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" autocomplete="username" required>

    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" autocomplete="current-password" required>

    {% if erro %}<div class="erro">{{ erro }}</div>{% endif %}

    <button type="submit">Entrar</button>
  </form>
</body>
</html>
